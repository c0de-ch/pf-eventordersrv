spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
  jms:
    listener:
      session:
        transacted: true
      min-concurrency: 2
      max-concurrency: 5
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

orders:
  clock:
    offset: PT0S
  worker:
    enabled: true
  processing:
    delay: PT0.5S
    failing-customer-prefix: FAIL-
    flaky-customer-prefix: FLAKY-
  messaging:
    order-created-queue: order.created
    order-created-dlq: DLQ.order.created
  outbox:
    relay:
      enabled: true
      poll-interval: PT1S
      batch-size: 50

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
