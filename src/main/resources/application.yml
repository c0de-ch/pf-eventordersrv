spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
  jms:
    listener:
      session:
        transacted: true
      min-concurrency: 2
      max-concurrency: 5
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

orders:
  clock:
    offset: PT0S
  worker:
    enabled: true
  processing:
    delay: PT0.5S
    failing-customer-prefix: FAIL-
    flaky-customer-prefix: FLAKY-
  messaging:
    order-accepted-queue: order.accepted
    order-accepted-dlq: DLQ.order.accepted
  outbox:
    relay:
      enabled: true
      poll-interval: PT1S
      batch-size: 50

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # a broker outage must not take the API out of service: the outbox buffers events
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      "[service.namespace]": orders
      "[deployment.environment.name]": ${DEPLOYMENT_ENVIRONMENT:local}
      # pod name in Kubernetes, container id in compose: two replicas must not share one metric series
      "[service.instance.id]": ${HOSTNAME:local}
  observations:
    enable:
      # a relay poll every second must not produce a trace per poll
      "[tasks.scheduled.execution]": false
  metrics:
    distribution:
      # percentiles on the dashboard need buckets; only the two business timers pay for them
      percentiles-histogram:
        "[order.processing]": true
        "[order.lifecycle]": true
  otlp:
    metrics:
      export:
        # Unlike traces and logs, the OTLP metrics registry pushes to localhost:4318 when no endpoint is
        # configured; environments with a collector switch it on (MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true)
        enabled: false
        step: 15s
        # same unit as the Prometheus endpoint, so dashboards use one name (order_processing_seconds)
        base-time-unit: seconds

logging:
  structured:
    ecs:
      service:
        node-name: ${HOSTNAME:local}
    json:
      customizer: ch.c0de.pf.orders.config.BusinessTimeLogCustomizer
      # Micrometer puts traceId/spanId into MDC; ECS names them trace.id/span.id
      rename:
        traceId: trace.id
        spanId: span.id
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(${LOG_CORRELATION_PATTERN:-}){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

---
spring:
  config:
    activate:
      on-profile: docker, k8s

logging:
  structured:
    format:
      console: ecs
