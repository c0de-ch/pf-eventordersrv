name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/order-service
  UI_IMAGE: ghcr.io/${{ github.repository }}/order-ui
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=order-service
            org.opencontainers.image.description=Event-driven order service: REST API, transactional outbox, JMS consumer
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service
      - id: ui_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.UI_IMAGE }}
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=order-ui
            org.opencontainers.image.description=Angular UI for the order service, served by nginx with an /api proxy
      - uses: docker/build-push-action@v7
        with:
          context: ui
          push: true
          tags: ${{ steps.ui_meta.outputs.tags }}
          labels: ${{ steps.ui_meta.outputs.labels }}
          cache-from: type=gha,scope=order-ui
          cache-to: type=gha,mode=max,scope=order-ui
      - uses: azure/setup-helm@v5
      - name: Package and publish the charts as OCI artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/order-service --version "$VERSION" --app-version "$VERSION" -d dist
          helm package charts/order-ui --version "$VERSION" --app-version "$VERSION" -d dist
          helm package charts/dev-infra --version "$VERSION" --app-version "$VERSION" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/order-service-$VERSION.tgz" "$CHARTS"
          helm push "dist/order-ui-$VERSION.tgz" "$CHARTS"
          helm push "dist/dev-infra-$VERSION.tgz" "$CHARTS"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
