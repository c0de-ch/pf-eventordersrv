version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the wrapper stays on Maven 3.9.x: 3.10 breaks the IntelliJ import
      - dependency-name: org.apache.maven:apache-maven
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # must match the OpenTelemetry API version that Spring Boot manages
      - dependency-name: io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Java 25 LTS; feature releases such as 26 are not followed
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      # Angular 22 pins TypeScript to 6.0.x
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      ui:
        patterns: ["*"]
