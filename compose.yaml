name: orders

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 12

  artemis:
    image: apache/artemis:2.57.0-alpine
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      - "${ARTEMIS_PORT:-61616}:61616"
      - "${ARTEMIS_CONSOLE_PORT:-8161}:8161"
    volumes:
      - ./deploy/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8161/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    profiles: [app]
    build: .
    image: order-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: orders
      ARTEMIS_URL: tcp://artemis:61616
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      DEPLOYMENT_ENVIRONMENT: compose
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  pgdata:
