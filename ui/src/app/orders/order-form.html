<h1>New order</h1>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="order-form">
  <label>
    Customer id
    <input type="text" formControlName="customerId" maxlength="64" autocomplete="off" />
    @if (problem('customerId'); as message) {
      <small class="error">{{ message }}</small>
    }
  </label>
  <label>
    Amount
    <input type="text" inputmode="decimal" formControlName="amount" placeholder="99.90" />
    @if (problem('amount'); as message) {
      <small class="error">{{ message }}</small>
    }
  </label>
  <label>
    Currency (optional, default CHF)
    <input type="text" formControlName="currency" maxlength="3" placeholder="CHF" />
    @if (problem('currency'); as message) {
      <small class="error">{{ message }}</small>
    }
  </label>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <p class="actions">
    <button type="submit" [disabled]="submitting()">Create order</button>
    <a routerLink="/orders">Cancel</a>
  </p>
  <p class="muted">Tip: a customer id starting with <code>FAIL-</code> fails processing, <code>FLAKY-</code> succeeds on the retry.</p>
</form>
