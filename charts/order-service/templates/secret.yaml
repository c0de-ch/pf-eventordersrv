{{- if not .Values.secrets.existingSecret }}
# Dev convenience only: production references an existing Secret (see values.secrets.existingSecret)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword or secrets.existingSecret is required" .Values.secrets.dbPassword | quote }}
  ARTEMIS_PASSWORD: {{ required "secrets.artemisPassword or secrets.existingSecret is required" .Values.secrets.artemisPassword | quote }}
{{- end }}
