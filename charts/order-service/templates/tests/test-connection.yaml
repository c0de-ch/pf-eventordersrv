apiVersion: v1
kind: Pod
metadata:
  name: {{ include "order-service.fullname" . }}-test-connection
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.37.0
      command: ["wget", "-q", "-O", "-", "http://{{ include "order-service.fullname" . }}:{{ .Values.service.port }}/actuator/health/readiness"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
