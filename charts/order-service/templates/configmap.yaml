apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfiles | quote }}
  DB_URL: {{ .Values.config.database.url | quote }}
  DB_USER: {{ .Values.config.database.user | quote }}
  ARTEMIS_URL: {{ .Values.config.artemis.url | quote }}
  ARTEMIS_USER: {{ .Values.config.artemis.user | quote }}
  ORDERS_PROCESSING_DELAY: {{ .Values.config.processingDelay | quote }}
  ORDERS_CLOCK_OFFSET: {{ .Values.config.clockOffset | quote }}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: {{ .Values.config.otel.samplingProbability | quote }}
  OTEL_SERVICE_NAME: {{ include "order-service.name" . | quote }}
  # the app defines service.namespace and deployment.environment.name itself; it reads this variable
  DEPLOYMENT_ENVIRONMENT: {{ .Values.config.otel.environment | default .Release.Namespace | quote }}
  {{- with .Values.config.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
