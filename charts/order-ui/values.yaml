# Default values for order-ui.

replicaCount: 1

image:
  repository: ghcr.io/c0de-ch/pf-eventordersrv/order-ui
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# host:port of the order-service Service; nginx forwards /api/* there
apiUpstream: order-service:8080

service:
  type: ClusterIP
  port: 8080
  nodePort: null     # with type NodePort (kind)

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []          # - host: orders.example.com
  tls: []

# nginx-unprivileged runs as uid 101 and writes only under /tmp
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
