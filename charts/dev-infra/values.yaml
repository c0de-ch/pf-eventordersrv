# Dev/test only: single replicas, inline passwords, no backups. Production uses managed services.

postgres:
  enabled: true
  image: postgres:17.11-alpine
  database: orders
  user: orders
  password: orders
  storage: 1Gi
  storageClassName: ""   # empty = cluster default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

artemis:
  enabled: true
  image: apache/artemis:2.57.0-alpine
  user: artemis
  password: artemis
  # files/broker.xml is a copy of deploy/artemis/broker.xml (checked by `make lint`)
  consoleNodePort: 30161   # web console on the host; 0 keeps it cluster-internal on 8161
  deadLetterHoldMs: 30000  # dead letters wait in DLQ.order.accepted.hold before the service consumes them
  expiryScanMs: 5000       # broker cadence for moving expired messages: the hold ends within hold + scan
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi

otelLgtm:
  enabled: true
  image: grafana/otel-lgtm:0.37.0
  grafanaNodePort: 30300
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
