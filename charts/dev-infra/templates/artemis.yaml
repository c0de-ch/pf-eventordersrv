{{- if .Values.artemis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-artemis
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: artemis
data:
  broker.xml: |-
{{ .Files.Get "files/broker.xml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-artemis
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: artemis
spec:
  ports:
    - name: core
      port: 61616
      targetPort: core
    - name: console
      port: 8161
      targetPort: console
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: artemis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-artemis
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: artemis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: artemis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: artemis
      annotations:
        checksum/broker: {{ .Files.Get "files/broker.xml" | sha256sum }}
    spec:
      containers:
        - name: artemis
          image: {{ .Values.artemis.image }}
          env:
            - name: ARTEMIS_USER
              value: {{ .Values.artemis.user | quote }}
            - name: ARTEMIS_PASSWORD
              value: {{ .Values.artemis.password | quote }}
            - name: EXTRA_ARGS
              value: "--http-host 0.0.0.0 --relax-jolokia --java-options -Dorders.dlq.hold={{ .Values.artemis.deadLetterHoldMs }} --java-options -Dorders.dlq.scan={{ .Values.artemis.expiryScanMs }}"
          ports:
            - name: core
              containerPort: 61616
            - name: console
              containerPort: 8161
          readinessProbe:
            tcpSocket:
              port: core
            periodSeconds: 5
          resources:
            {{- toYaml .Values.artemis.resources | nindent 12 }}
          volumeMounts:
            # applied when the instance is created on first start; messages are not persisted across pod restarts
            - name: broker-config
              mountPath: /var/lib/artemis-instance/etc-override/broker.xml
              subPath: broker.xml
      volumes:
        - name: broker-config
          configMap:
            name: {{ .Release.Name }}-artemis
{{- end }}
