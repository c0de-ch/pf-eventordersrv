{{- if .Values.otelLgtm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-lgtm
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-lgtm
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: grafana
      port: 3000
      targetPort: grafana
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: otel-lgtm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-lgtm
spec:
  type: NodePort
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
      nodePort: {{ .Values.otelLgtm.grafanaNodePort }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: otel-lgtm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-lgtm
  labels:
    {{- include "dev-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: otel-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: {{ .Values.otelLgtm.image }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: grafana
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.otelLgtm.resources | nindent 12 }}
{{- end }}
